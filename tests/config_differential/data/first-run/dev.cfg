## Settings file was created by plugin Blue Prince Head Tracking v0.0.0
## Plugin GUID: com.cameraunlock.blueprince.headtracking

[Collision]

## Sweep the lean against the level so leaning into a wall cannot put the view inside it.
# Setting type: Boolean
# Default value: true
CollisionEnabled = true

## How far off a surface the view is held, in metres. Must be larger than the camera's near clip distance, or the wall is still not drawn and you still see through it.
# Setting type: Single
# Default value: 0.12
# Acceptable value range: From 0.02 to 0.5
CollisionRadius = 0.12

## How gently the lean opens back up once an obstruction clears. Tightening is always instant. 0.9 is about a fifth of a second.
# Setting type: Single
# Default value: 0.9
# Acceptable value range: From 0 to 1
CollisionReleaseSmoothing = 0.9

[General]

## Enable head tracking automatically when the game starts. End (or Ctrl+Shift+Y) toggles it in game.
# Setting type: Boolean
# Default value: true
EnabledOnStartup = true

## Move the game's pointer to your real aim point while tracking. false leaves its position unchanged.
# Setting type: Boolean
# Default value: true
ShowReticle = true

## true = horizon-locked yaw: turning your head rotates the view about the world's up axis. false = the view's own up axis. Page Down (or Ctrl+Shift+H) toggles it in game.
# Setting type: Boolean
# Default value: true
WorldSpaceYaw = true

## Stop applying head tracking while the game window is not focused.
# Setting type: Boolean
# Default value: true
PauseOnLostFocus = true

## Write the camera rig, the aim geometry and the game-state signals to HeadTracking.log. Verbose; turn it on when reporting a problem.
# Setting type: Boolean
# Default value: false
DiagnosticLogging = false

[Hotkeys]

