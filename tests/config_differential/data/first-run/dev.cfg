[Network]

## UDP port the mod listens on for OpenTrack protocol packets. 4242 is the OpenTrack default.
# Setting type: Int32
# Default value: 4242
# Acceptable value range: From 1024 to 65535
UdpPort = 4242

[Position]

## Whether leaning moves the view. Page Up (or Ctrl+Shift+G) cycles this in game.
# Setting type: Boolean
# Default value: true
Enabled = true

## Maximum sideways lean in metres, applied both ways.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0.01 to 0.5
LimitX = 0.3

## Maximum upward movement in metres.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0.01 to 0.5
LimitY = 0.2

## Maximum downward movement in metres.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0.01 to 0.5
LimitYDown = 0.2

## Maximum forward lean in metres.
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0.01 to 0.5
LimitZ = 0.4

## Maximum backward lean in metres. Deliberately tighter than LimitZ so the view cannot pull back through the player.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0.01 to 0.5
LimitZBack = 0.1

[Smoothing]

## Smoothing for a tracker sending from this machine over loopback (127.0.0.1). 0 = lightest, 1 = heaviest. Covers rotation and position.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
LocalSmoothing = 0

## Smoothing for a tracker sending from another device on the network, such as a phone. 0 = lightest, 1 = heaviest. Covers rotation and position.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
RemoteSmoothing = 0.15

