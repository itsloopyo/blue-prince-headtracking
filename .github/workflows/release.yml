name: Release
run-name: "Release ${{ github.ref_name }}"

# Everything this release does lives in cameraunlock-core's release-mod.yml.
# Only the values below are this mod's. Pinned to a commit SHA, never a branch:
# that workflow runs with contents:write, the Discord webhook and the Lopari PAT.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: itsloopyo/cameraunlock-core/.github/workflows/release-mod.yml@a03c24290fae3a9c61f67adcb7c5ba4eedf69f20
    with:
      project-name: 'Head Tracking for Blue Prince'
      version-source: csproj
      version-path: 'src/BluePrinceHeadTracking/BluePrinceHeadTracking.csproj'
      artifact-paths: 'src/BluePrinceHeadTracking/ cameraunlock-core scripts/install.cmd scripts/uninstall.cmd'
      dotnet-version: '8.0.x'
    permissions:
      contents: write
    secrets: inherit
