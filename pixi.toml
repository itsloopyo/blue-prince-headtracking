[workspace]
name = "blue-prince-head-tracking"
version = "0.0.0"
description = "Head tracking mod for Blue Prince using the CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
restore = "dotnet restore src/BluePrinceHeadTracking/BluePrinceHeadTracking.csproj"
setup = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1", depends-on = ["restore"] }
build = { cmd = "dotnet build src/BluePrinceHeadTracking/BluePrinceHeadTracking.csproj -c Release -m:1", depends-on = ["setup"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }
# The config tests, among them the differential test in tests/config_differential, which holds
# the legacy import to the published build's own reader on its first-run file and on core's
# mutation corpus, then core's canonical config lint over the committed file and every file the
# test migrated. What the mod does to the camera is checked by an in-game pass.
test = { cmd = "dotnet test tests/BluePrinceHeadTracking.Tests/BluePrinceHeadTracking.Tests.csproj -c Release && node tests/config_differential/lint-migrated.mjs tests/BluePrinceHeadTracking.Tests/bin/Release/net8.0/migrated", depends-on = ["build"] }
# Rewrites config/CameraUnlock.ini from the config table after a change to a row, a comment or a
# default. The render test compares the two on every `pixi run test`, so the committed file cannot
# drift from the code.
render-config = { cmd = "dotnet test tests/BluePrinceHeadTracking.Tests/BluePrinceHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName~ConfigTests.CommittedFileIsTheRenderedDefaults && node cameraunlock-core/scripts/encode-seed.mjs", env = { CAMERAUNLOCK_RENDER_CONFIG = "write" }, depends-on = ["build"] }

# The two content gates over a built package, run in CI and by the release script
# after packaging. validate-manifest reads the newest ZIP in release/ and checks
# every source a manifest entry names is really in it; validate-notices checks
# THIRD-PARTY-NOTICES.md reproduces the licence text of each component core's
# rule set knows the vendored loader redistributes.
#
# No depends-on: both callers have already packaged, and re-declaring it made
# pixi rebuild and repackage from scratch to verify the ZIP it had just built.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"
validate-notices = "node cameraunlock-core/scripts/validate-notices.mjs"
uninstall = "scripts/uninstall.cmd"
clean = "dotnet clean src/BluePrinceHeadTracking/BluePrinceHeadTracking.csproj"

# Bump the vendored mod-loader copy to the latest upstream build.
# Manual; commit the result. CI does not run this.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"

release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

[dependencies]
# Node runs the canonical config lint in `test`, which `package` depends on, and
# validate-manifest. Pinned to the release cameraunlock-core's own lock resolves.
nodejs = "==26.5.0"
